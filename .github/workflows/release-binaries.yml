name: Build and attach release binaries

# Builds psi-panel and ConsoleClient for every architecture regionhop's
# installer knows how to auto-detect (see install.sh's detect_arch), packs
# each architecture's pair into one regionhop-linux-<arch>.tar.gz, and
# uploads those to the GitHub release matching the pushed tag -- one
# download per architecture instead of two, per install.sh's
# download_release_bundle. Runs on a real Linux runner because
# ConsoleClient's dependencies (blake3, psiphon-tls/fips140, etc.) use
# hand-written assembly that some Go toolchains can't cross-compile
# reliably from other host OSes.
on:
  push:
    tags:
      - "v*"
  # Manual dry run (tests + builds, no upload) to verify before tagging.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout regionhop
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Checkout psiphon-tunnel-core
        uses: actions/checkout@v4
        with:
          repository: Psiphon-Labs/psiphon-tunnel-core
          path: psiphon-tunnel-core

      - name: Fetch Xray-core (for the panel's V2Ray upstream mode)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Latest Xray-core at build time, then frozen into this release's
          # bundles -- same "pinned per regionhop release" model as the core.
          mkdir -p xray
          declare -A xray_assets=( [amd64]="Xray-linux-64.zip" [arm64]="Xray-linux-arm64-v8a.zip" [armv7]="Xray-linux-arm32-v7a.zip" )
          for name in "${!xray_assets[@]}"; do
            gh release download --repo XTLS/Xray-core --pattern "${xray_assets[$name]}" --dir "xray/$name"
            unzip -o -q "xray/$name/${xray_assets[$name]}" xray -d "xray/$name"
            chmod 0755 "xray/$name/xray"
          done

      - name: Test panel (incl. generated V2Ray configs against real Xray)
        run: |
          set -euo pipefail
          cd panel
          go mod tidy
          XRAY_BIN="$GITHUB_WORKSPACE/xray/amd64/xray" go test -v -count=1 ./...

      - name: Real systemd/journalctl status test (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          cd panel
          sudo env "PATH=$PATH" REGIONHOP_REAL_SYSTEMD=1 go test -v -count=1 -run TestRealSystemd ./...

      - name: Firewall sync script test (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          must()    { grep -q -- "$1" <<<"$2" || { echo "MISSING: $1"; echo "$2"; exit 1; }; }
          mustnot() { if grep -q -- "$1" <<<"$2"; then echo "UNEXPECTED: $1"; echo "$2"; exit 1; fi; }
          work=$(mktemp -d)
          # Extract the script exactly as install.sh embeds it.
          awk '/sync-firewall\.sh" <<.EOF.$/{f=1;next} /^EOF$/{if(f){exit}} f' install.sh > "$work/sync.sh"
          test -s "$work/sync.sh"
          printf '[\n {"name":"a","region":"US","socks_port": 19013},\n {"name":"b","region":"DE","socks_port": 19002}\n]\n' > "$work/tunnels.json"
          sed -i "s#__REGISTRY__#$work/tunnels.json#" "$work/sync.sh"
          chmod +x "$work/sync.sh"
          sudo "$work/sync.sh"; sudo "$work/sync.sh"   # twice: must be idempotent
          rules=$(sudo iptables -S REGIONHOP-SOCKS); echo "$rules"
          must '--dport 19013' "$rules"; must '--dport 19002' "$rules"
          mustnot '--dport 19500' "$rules"
          mustnot '19000:19999' "$(sudo iptables -S)"
          jumps=$(sudo iptables -S INPUT | grep -c -- '-j REGIONHOP-SOCKS' || true)
          [ "$jumps" = 1 ] || { echo "expected 1 jump, got $jumps"; exit 1; }
          # Another program (not ConsoleClient) already listening on a location's
          # port: that port must be left alone, and the clash reported.
          python3 -m http.server 19002 --bind 0.0.0.0 >/dev/null 2>&1 &
          srv=$!; sleep 1
          sudo "$work/sync.sh"
          rules=$(sudo iptables -S REGIONHOP-SOCKS)
          must '--dport 19013' "$rules"; mustnot '--dport 19002' "$rules"
          awk '/^warn_port_conflicts\(\) \{/{f=1} f{print} /^}/{if(f){exit}}' install.sh > "$work/fn.sh"
          test -s "$work/fn.sh"
          warn=$(sudo env REGISTRY="$work/tunnels.json" bash -c "source $work/fn.sh; warn_port_conflicts" 2>&1)
          echo "$warn"
          must "location 'b'" "$warn"; must '19002' "$warn"; mustnot "location 'a'" "$warn"
          kill "$srv"; wait "$srv" 2>/dev/null || true
          sudo "$work/sync.sh"
          must '--dport 19002' "$(sudo iptables -S REGIONHOP-SOCKS)"   # blocked again once nothing else holds it
          # A registry change must drop the stale rule and keep the other.
          printf '[{"name":"a","region":"US","socks_port": 19013}]\n' > "$work/tunnels.json"
          sudo "$work/sync.sh"
          rules=$(sudo iptables -S REGIONHOP-SOCKS)
          must '--dport 19013' "$rules"; mustnot '--dport 19002' "$rules"
          echo "firewall sync OK"

      - name: Panel SSL certificate helper test (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          # Extract the root helper exactly as install.sh embeds it.
          awk '/install-cert\.sh" <<.EOF.$/{f=1;next} /^EOF$/{if(f){exit}} f' install.sh > "$work/h.sh"
          test -s "$work/h.sh"
          me=$(id -un)
          sed -i "s#__PREFIX__#$work/pfx#; s#__SERVICE_USER__#$me#" "$work/h.sh"
          cd "$work"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout k.pem -out c.pem -subj "/CN=t.example" -days 30 2>/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -keyout k2.pem -out c2.pem -subj "/CN=o.example" -days 30 2>/dev/null
          # A matching pair is installed (root-run, as sudo does).
          out=$(sudo bash h.sh c.pem k.pem); echo "$out"
          grep -q 'subject=' <<<"$out"; grep -q 'notAfter=' <<<"$out"
          test -s pfx/data/ssl/cert.pem; test -s pfx/data/ssl/key.pem
          [ "$(stat -c %a pfx/data/ssl/key.pem)" = 600 ]
          [ "$(stat -c %U pfx/data/ssl/key.pem)" = "$me" ]
          # A symlinked source (like letsencrypt/live) works too.
          ln -s "$work/c2.pem" link.pem; ln -s "$work/k2.pem" linkk.pem
          sudo bash h.sh link.pem linkk.pem >/dev/null
          cmp pfx/data/ssl/cert.pem c2.pem
          # A chain with several certificates, and a CRLF file, are fine.
          cat c.pem c2.pem > chain.pem; sudo bash h.sh chain.pem k.pem >/dev/null
          [ "$(grep -c 'BEGIN CERTIFICATE' pfx/data/ssl/cert.pem)" = 2 ]
          sed 's/$/\r/' c.pem > crlf.pem; sudo bash h.sh crlf.pem k.pem >/dev/null
          ! grep -q $'\r' pfx/data/ssl/cert.pem
          sudo bash h.sh link.pem linkk.pem >/dev/null   # leave a known pair installed
          # Everything else must be refused and leave the installed pair alone.
          before=$(sha256sum pfx/data/ssl/cert.pem)
          must_fail() { if sudo bash h.sh "$@" >/dev/null 2>&1; then echo "SHOULD HAVE FAILED: $*"; exit 1; fi; }
          must_fail c.pem k2.pem                       # mismatched pair
          echo 'root:x:0:0:root' > shadow; must_fail shadow k.pem
          must_fail k.pem k.pem                        # a key is not a certificate
          { echo 'junk'; cat c.pem; } > cj.pem; must_fail cj.pem k.pem
          { cat c.pem; echo junk; } > cj2.pem; must_fail cj2.pem k.pem   # text after the certificate
          { cat c.pem; cat k.pem; } > cj3.pem; must_fail cj3.pem k.pem   # a key riding along in the cert file
          must_fail c.pem                              # wrong argument count
          must_fail nope.pem k.pem
          [ "$before" = "$(sha256sum pfx/data/ssl/cert.pem)" ]
          echo "ssl helper OK"

      - name: Build psi-panel + ConsoleClient and pack per-architecture bundles
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CORE_VERSION=$(git -C psiphon-tunnel-core rev-parse --short HEAD)
          mkdir -p dist
          declare -A targets=( [amd64]="amd64" [arm64]="arm64" [armv7]="arm:7" )
          for name in "${!targets[@]}"; do
            spec="${targets[$name]}"
            goarch="${spec%%:*}"
            goarm="${spec#*:}"
            export CGO_ENABLED=0 GOOS=linux GOARCH="$goarch"
            [[ "$goarch" == "arm" ]] && export GOARM="$goarm" || unset GOARM || true

            workdir=$(mktemp -d)
            (cd panel && go mod tidy && go build -ldflags "-X main.CurrentVersion=$VERSION" -o "$workdir/psi-panel" .)
            (cd psiphon-tunnel-core/ConsoleClient && go build -o "$workdir/ConsoleClient" .)
            echo "$CORE_VERSION" > "$workdir/core-version.txt"
            cp "xray/$name/xray" "$workdir/xray"
            tar -czf "dist/regionhop-linux-${name}.tar.gz" -C "$workdir" psi-panel ConsoleClient core-version.txt xray
            rm -rf "$workdir"
          done

      - name: Upload bundles to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
