name: Build and attach release binaries

# Builds psi-panel and ConsoleClient for every architecture regionhop's
# installer knows how to auto-detect (see install.sh's detect_arch), packs
# each architecture's pair into one regionhop-linux-<arch>.tar.gz, and
# uploads those to the GitHub release matching the pushed tag -- one
# download per architecture instead of two, per install.sh's
# download_release_bundle. Runs on a real Linux runner because
# ConsoleClient's dependencies (blake3, psiphon-tls/fips140, etc.) use
# hand-written assembly that some Go toolchains can't cross-compile
# reliably from other host OSes.
on:
  push:
    tags:
      - "v*"
  # Manual dry run (tests + builds, no upload) to verify before tagging.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout regionhop
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Checkout psiphon-tunnel-core
        uses: actions/checkout@v4
        with:
          repository: Psiphon-Labs/psiphon-tunnel-core
          path: psiphon-tunnel-core

      - name: Fetch Xray-core (for the panel's V2Ray upstream mode)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Latest Xray-core at build time, then frozen into this release's
          # bundles -- same "pinned per regionhop release" model as the core.
          mkdir -p xray
          declare -A xray_assets=( [amd64]="Xray-linux-64.zip" [arm64]="Xray-linux-arm64-v8a.zip" [armv7]="Xray-linux-arm32-v7a.zip" )
          for name in "${!xray_assets[@]}"; do
            gh release download --repo XTLS/Xray-core --pattern "${xray_assets[$name]}" --dir "xray/$name"
            unzip -o -q "xray/$name/${xray_assets[$name]}" xray -d "xray/$name"
            chmod 0755 "xray/$name/xray"
          done

      - name: Test panel (incl. generated V2Ray configs against real Xray)
        run: |
          set -euo pipefail
          cd panel
          go mod tidy
          XRAY_BIN="$GITHUB_WORKSPACE/xray/amd64/xray" go test -v -count=1 ./...

      - name: Build psi-panel + ConsoleClient and pack per-architecture bundles
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CORE_VERSION=$(git -C psiphon-tunnel-core rev-parse --short HEAD)
          mkdir -p dist
          declare -A targets=( [amd64]="amd64" [arm64]="arm64" [armv7]="arm:7" )
          for name in "${!targets[@]}"; do
            spec="${targets[$name]}"
            goarch="${spec%%:*}"
            goarm="${spec#*:}"
            export CGO_ENABLED=0 GOOS=linux GOARCH="$goarch"
            [[ "$goarch" == "arm" ]] && export GOARM="$goarm" || unset GOARM || true

            workdir=$(mktemp -d)
            (cd panel && go mod tidy && go build -ldflags "-X main.CurrentVersion=$VERSION" -o "$workdir/psi-panel" .)
            (cd psiphon-tunnel-core/ConsoleClient && go build -o "$workdir/ConsoleClient" .)
            echo "$CORE_VERSION" > "$workdir/core-version.txt"
            cp "xray/$name/xray" "$workdir/xray"
            tar -czf "dist/regionhop-linux-${name}.tar.gz" -C "$workdir" psi-panel ConsoleClient core-version.txt xray
            rm -rf "$workdir"
          done

      - name: Upload bundles to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
