<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in — Psiphon Panel</title>
<style>
body{font-family:system-ui,sans-serif;background:#0f1115;color:#e6e6e6;display:flex;height:100vh;align-items:center;justify-content:center;margin:0}
form{background:#181b21;padding:2rem;border-radius:10px;width:300px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
h1{font-size:1.1rem;margin:0 0 1rem}
input{width:100%;padding:.6rem;margin-bottom:.8rem;border-radius:6px;border:1px solid #333;background:#0f1115;color:#eee;box-sizing:border-box}
button{width:100%;padding:.6rem;border:0;border-radius:6px;background:#3b82f6;color:#fff;font-weight:600;cursor:pointer}
.err{color:#f87171;margin-bottom:.8rem;font-size:.9rem}
</style></head>
<body>
<form method="post" action="/login">
  <h1>Psiphon Tunnel Panel</h1>
  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  <input type="password" name="password" placeholder="Admin password" autofocus required>
  <button type="submit">Sign in</button>
</form>
</body></html>
