<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credentials — regionhop</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><div class="brand-mark">R</div>regionhop</div>
    <div class="nav-actions">
      <a class="btn btn-ghost btn-sm" href="/">Dashboard</a>
      <form class="inline" method="post" action="/logout"><button class="btn-ghost btn-sm" type="submit">Log out</button></form>
    </div>
  </div>

  <div class="main" style="max-width:560px">
    <div class="page-header">
      <h1>Psiphon credentials</h1>
      <div class="desc">Applied to every new location added from now on.</div>
    </div>

    <div class="card">
      {{if .Saved}}<div class="alert alert-success">Saved.</div>{{end}}
      <form method="post" action="/settings">
        <div class="field">
          <label for="pcid">PropagationChannelId</label>
          <input id="pcid" type="text" name="propagation_channel_id" value="{{.PropagationChannelID}}" autocomplete="off">
        </div>
        <div class="field">
          <label for="sid">SponsorId</label>
          <input id="sid" type="text" name="sponsor_id" value="{{.SponsorID}}" autocomplete="off">
        </div>
        <button type="submit">Save</button>
      </form>
      <div class="card-sub">
        Not retroactively applied to existing locations — remove and re-add a
        location (or edit <span class="mono">/opt/psi-panel/configs/&lt;name&gt;.json</span>
        directly) to update it.
      </div>
    </div>
  </div>
</div>
</body></html>
