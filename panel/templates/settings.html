<!doctype html>
<html lang="{{.Lang}}" dir="{{.Dir}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credentials — regionhop</title>
{{if .Font}}<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{.Font}}:wght@400;500;600;700&display=swap">{{end}}
<link rel="stylesheet" href="{{url "/static/style.css"}}">
{{if .Font}}<style>body{font-family:"{{.Font}}",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}</style>{{end}}
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><div class="brand-mark">R</div>regionhop</div>
    <div class="nav-actions">
      <select class="lang-switch" onchange="location.search='?lang='+this.value">
        {{$cur := .Lang}}{{range langs}}<option value="{{.Code}}" {{if eq .Code $cur}}selected{{end}}>{{.Native}}</option>{{end}}
      </select>
      <a class="btn btn-ghost btn-sm" href="{{url "/"}}">{{t .Lang "nav.dashboard"}}</a>
      <form class="inline" method="post" action="{{url "/logout"}}"><button class="btn-ghost btn-sm" type="submit">{{t .Lang "nav.logout"}}</button></form>
    </div>
  </div>

  <div class="main" style="max-width:640px">
    <div class="page-header">
      <h1>{{t .Lang "creds.title"}}</h1>
      <div class="desc">{{t .Lang "creds.desc"}}</div>
    </div>

    <div class="card">
      {{if .Saved}}<div class="alert alert-success">{{t .Lang "creds.saved"}}</div>{{end}}
      {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
      <form method="post" action="{{url "/settings"}}">
        <div class="field">
          <label for="cfg">{{t .Lang "creds.label"}}</label>
          <textarea id="cfg" name="config_json" autocomplete="off" rows="14" placeholder='{
  "PropagationChannelId": "...",
  "SponsorId": "...",
  "RemoteServerListUrl": "...",
  "RemoteServerListSignaturePublicKey": "...",
  "ObfuscatedServerListRootURL": "...",
  "ServerEntrySignaturePublicKey": "...",
  "NetworkID": "..."
}'>{{.ConfigJSON}}</textarea>
        </div>
        <button type="submit">{{t .Lang "creds.submit"}}</button>
      </form>
      <div class="card-sub">
        {{t .Lang "creds.note1"}}<br><br>
        {{t .Lang "creds.note2"}}
      </div>
    </div>
  </div>
</div>
</body></html>
